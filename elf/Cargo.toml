[package]
name = "elf-cpp-bindings"
description = "C++ bindings for the elf crate using crubit"
version = "0.1.0-prerelease"
license-file = "../LICENSE"
license = "Apache-2.0"
edition = "2024"
repository = "https://github.com/google/safe-bindings"

include = [
    "Cargo.toml",
    "README.md",
    "*.rs",
    "*.h",
    "*.cc",
    "CMakeLists.txt",
]

[lib]
path = "lib.rs"
doctest = false

[dependencies]
anyhow = "1"
crubit_annotate = "0.1.0"
elf = "0.8"
paste = "1"
