name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.binding }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binding:
        # keep-sorted start
          - deflate
          - fft
          - kamadak_exif
          - lzma
          - pixel_bridge
          - regex
          - roaring_bridge
          - saphyr
          - serde_json
          - stemming
          - xml
          - zip
        # keep-sorted end
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          # NOTE: b/530101873 - Crubit has some compiler warnings. By default rustflags is
          # "-D warnings" causing the build to fail.
          rustflags: ""

      - name: Configure CMake
        run: cmake -B build -S ${{ matrix.binding }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run examples
        run: ctest --test-dir build --output-on-failure --no-tests=ignore -L '^example$'

  summary:
    name: summary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Complete
        run: echo "All bindings built successfully!"
