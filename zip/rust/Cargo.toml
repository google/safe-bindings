[package]
name = "rust"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"

[lib]
path = "lib.rs"
doctest = false

[dependencies]
zip = { version = "9.0", features = ["deflate", "bzip2", "time", "zstd", "lzma", "xz"] }

# Used only by the `#[cfg(test)]` modules (`cargo test`).
[dev-dependencies]
googletest = "0.14"
